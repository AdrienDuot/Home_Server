# Applications affichées sur Homepage — https://gethomepage.dev/configs/services/
# {{HOMEPAGE_VAR_...}} est remplacé par les valeurs du fichier .env
#
# Pour afficher des statistiques (nombre de films, de photos…), crée une clé API
# dans l'application, mets-la dans .env (HOMEPAGE_..._KEY), puis décommente
# le bloc "widget" correspondant et relance : docker compose up -d homepage

- Médias:
    - Immich:
        icon: immich.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:2283
        description: Photos et vidéos
        server: my-docker
        container: immich_server
        # widget:
        #   type: immich
        #   url: http://immich-server:2283
        #   key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
        #   version: 2

    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8096
        description: Films et séries
        server: my-docker
        container: jellyfin
        # widget:
        #   type: jellyfin
        #   url: http://jellyfin:8096
        #   key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        #   enableBlocks: true

    - Seerr:
        icon: jellyseerr.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:5055
        description: Demander un film ou une série
        server: my-docker
        container: seerr
        # widget:
        #   type: jellyseerr
        #   url: http://seerr:5055
        #   key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

- Outils:
    - Vaultwarden:
        icon: vaultwarden.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8222
        description: Mots de passe
        server: my-docker
        container: vaultwarden

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:3001
        description: Surveillance des services
        server: my-docker
        container: uptime-kuma
